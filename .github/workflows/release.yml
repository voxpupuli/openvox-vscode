name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  RUBY_VERSION: "3.4"

jobs:
  release:
    name: Build and release VSIX
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out extension
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set build metadata
        id: release
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"

          tag_version="${GITHUB_REF_NAME#v}"

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$tag_version" != "$package_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must be v$package_version"
            exit 1
          fi

          echo "vsix=openvox-vscode-$package_version.vsix" >> "$GITHUB_OUTPUT"

      # A retry can run for the same tag if the GitHub release succeeded but publishing to Open VSX failed.
      # Published releases are immutable, so reuse their VSIX instead of rebuilding or replacing assets.
      # Missing releases and unfinished drafts still need the build and publication steps.
      - name: Determine GitHub release state
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Listing releases distinguishes a missing release from an API failure.
          is_draft="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .draft")"

          case "$is_draft" in
            true) state=draft ;;
            false) state=published ;;
            "") state=missing ;;
            *) echo "::error::Unexpected GitHub release state: $is_draft"; exit 1 ;;
          esac

          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set up Ruby
        if: steps.release_state.outputs.state != 'published'
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Build and verify package contents
        if: steps.release_state.outputs.state != 'published'
        run: npm run check

      - name: Build VSIX
        if: steps.release_state.outputs.state != 'published'
        run: |
          mkdir -p artifacts
          npx --no-install vsce package --out "artifacts/${{ steps.release.outputs.vsix }}"

      - name: Prepare versioned GitHub release
        if: steps.release_state.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.release_state.outputs.state }}" == "draft" ]]; then
            gh release upload "${{ github.ref_name }}" \
              "artifacts/${{ steps.release.outputs.vsix }}" \
              --clobber
            gh release edit "${{ github.ref_name }}" --draft=false
          else
            gh release create "${{ github.ref_name }}" \
              "artifacts/${{ steps.release.outputs.vsix }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              --verify-tag
          fi

      - name: Download published VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          # Publish the exact asset from the immutable GitHub release to Open VSX.
          gh release download "${{ github.ref_name }}" \
            --pattern "${{ steps.release.outputs.vsix }}" \
            --dir artifacts \
            --clobber

      - name: Publish to open-vsx Marketplace
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          npx --no-install ovsx publish --skip-duplicate \
            "artifacts/${{ steps.release.outputs.vsix }}"
